name: web-react

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: web-react-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web_react: ${{ steps.filter.outputs.web_react }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$MQ_BASE" ;;
            *) base="$PUSH_BEFORE" ;;
          esac
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "web_react=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(web-react/|\.github/workflows/web-react\.yml$)'; then
            echo "web_react=true" >> "$GITHUB_OUTPUT"
          else
            echo "web_react=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.web_react == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: web-react/.nvmrc
          cache: pnpm
          cache-dependency-path: web-react/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm check

  gate:
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    steps:
      - name: Require changes and check to be green or skipped
        env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
        run: |
          [ "$CHANGES" = "success" ] || { echo "changes: $CHANGES"; exit 1; }
          case "$CHECK" in
            success | skipped) ;;
            *) echo "check: $CHECK"; exit 1 ;;
          esac
