include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/ui/core/l10n/generated/**"
    - "build/**"

linter:
  rules:
    # A starter template: documenting every public member is noise, not signal.
    public_member_api_docs: false
    # Full package paths everywhere in lib/ (never '../x.dart').
    always_use_package_imports: true
    # Robots and arrange/act/assert test steps read better as separate statements.
    cascade_invocations: false
    prefer_relative_imports: false
