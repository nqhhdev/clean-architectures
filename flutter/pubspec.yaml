name: clean_architecture
description: "Clean-architecture Flutter starter: official app-architecture layers, Riverpod, codegen, and tests at every tier."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  http: ^1.6.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  meta: ^1.17.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.2
  path: ^1.9.1
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  generate: true
