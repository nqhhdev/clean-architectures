version: 2
updates:
  # Dart/Flutter package updates for the Flutter stack
  - package-ecosystem: "pub"
    directory: "/flutter"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "pub"
    # Group minor/patch bumps to reduce PR noise; major bumps arrive alone for review
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"

  # npm package updates for the web-react stack (pnpm lockfile)
  - package-ecosystem: "npm"
    directory: "/web-react"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    # TypeScript is pinned to 6.0.3 until typescript-eslint supports 7 (ADR 0006); 6.x bumps still arrive
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node types follow the Node runtime major (.nvmrc, Dockerfile); bumped together with it
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Group minor/patch bumps to reduce PR noise; major bumps arrive alone for review
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions updates (the workflow pins actions by commit SHA)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"

  # Base images of the web-react container (node build stage, nginx-unprivileged runtime)
  - package-ecosystem: "docker"
    directory: "/web-react"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    # The Node major moves with .nvmrc and CI in one deliberate change
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
